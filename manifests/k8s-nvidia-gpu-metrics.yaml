apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-gpu-agent-config
  namespace: logging-and-monitoring
data:
  agent.yaml: |
    metrics:
      global:
        scrape_interval: 60s
      configs:
        - name: default
          scrape_configs:
            - job_name: 'dcgm-stats'
              static_configs:
                - targets: ['nvidia-dcgm-exporter.nvidia.svc.cluster.local:9400']
              metric_relabel_configs:
                - action: lowercase
                  source_labels: [__name__]
                  target_label: __name__
          remote_write:
            - url: http://openobserve-router.openobserve.svc.cluster.local:5080/api/default/prometheus/api/v1/write
              headers:
                organization: default
                stream-name: gpu_metrics
              basic_auth:
                username_file: /etc/oo-auth/username
                password_file: /etc/oo-auth/password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-gpu-agent
  namespace: logging-and-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    linkerd.io/inject: "disabled"
    configmap.reloader.stakater.com/reload: "grafana-gpu-agent-config"
    secret.reloader.stakater.com/reload: "oo-auth"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-gpu-agent
  template:
    metadata:
      labels:
        app: grafana-gpu-agent
    spec:
      initContainers:
        - name: prepare-oo-auth
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              AUTH_HEADER="$(tr -d '\r\n' < /etc/oo-auth-raw/OO_AUTH_HEADER)"
              case "$AUTH_HEADER" in
                "Basic "*) AUTH_CREDENTIALS="${AUTH_HEADER#Basic }" ;;
                Basic\ *) AUTH_CREDENTIALS="${AUTH_HEADER#Basic }" ;;
                *) AUTH_CREDENTIALS="$AUTH_HEADER" ;;
              esac
              mkdir -p /etc/oo-auth
              printf "%s" "$AUTH_CREDENTIALS" > /etc/oo-auth/credentials
              USERPASS="$(printf '%s' "$AUTH_CREDENTIALS" | base64 -d 2>/dev/null || true)"
              USERNAME="${USERPASS%%:*}"
              PASSWORD="${USERPASS#*:}"
              if [ -z "$USERPASS" ] || [ "$USERNAME" = "$USERPASS" ]; then
                echo "OO_AUTH_HEADER is not a valid Basic base64 user:pass" >&2
                exit 1
              fi
              printf "%s" "$USERNAME" > /etc/oo-auth/username
              printf "%s" "$PASSWORD" > /etc/oo-auth/password
          volumeMounts:
            - name: oo-auth-raw
              mountPath: /etc/oo-auth-raw
              readOnly: true
            - name: oo-auth-processed
              mountPath: /etc/oo-auth
      containers:
        - name: agent
          image: grafana/agent:v0.40.3
          args:
            - "--config.file=/etc/agent/agent.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/agent
              readOnly: true
            - name: oo-auth-processed
              mountPath: /etc/oo-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: grafana-gpu-agent-config
        - name: oo-auth-raw
          secret:
            secretName: oo-auth
            items:
              - key: OO_AUTH_HEADER
                path: OO_AUTH_HEADER
        - name: oo-auth-processed
          emptyDir: {}
