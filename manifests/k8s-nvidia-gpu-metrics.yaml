apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-gpu-agent-config
  namespace: logging-and-monitoring
data:
  agent.yaml: |
    metrics:
      global:
        scrape_interval: 60s
      configs:
        - name: default
          scrape_configs:
            - job_name: 'dcgm-stats'
              static_configs:
                - targets: ['nvidia-dcgm-exporter.nvidia.svc.cluster.local:9400']
          remote_write:
            - url: http://openobserve-openobserve-standalone.openobserve.svc.cluster.local:5080/api/default/default/prometheus/api/v1/write
              headers:
                organization: default
                stream-name: default
              authorization:
                type: Basic
                # Rendered by init container using oo-auth secret (Basic <base64> without the Basic prefix here)
                credentials: "__OO_AUTH_CREDENTIALS__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-gpu-agent
  namespace: logging-and-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-gpu-agent
  template:
    metadata:
      labels:
        app: grafana-gpu-agent
    spec:
      initContainers:
        - name: render-agent-config
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /etc/agent
              AUTH_HEADER="$(tr -d '\r\n' < /etc/oo-auth/OO_AUTH_HEADER)"
              AUTH_CREDENTIALS="${AUTH_HEADER#Basic }"
              # Render template, swapping in the base64 credentials (without the Basic prefix)
              awk -v val="$AUTH_CREDENTIALS" '{ gsub(/__OO_AUTH_CREDENTIALS__/, val); print }' /etc/agent-src/agent.yaml > /etc/agent/agent.yaml
          volumeMounts:
            - name: config-template
              mountPath: /etc/agent-src
              readOnly: true
            - name: oo-auth
              mountPath: /etc/oo-auth
              readOnly: true
            - name: config-final
              mountPath: /etc/agent
      containers:
        - name: agent
          image: grafana/agent:v0.40.3
          args:
            - "--config.file=/etc/agent/agent.yaml"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: config-final
              mountPath: /etc/agent
      volumes:
        - name: config-template
          configMap:
            name: grafana-gpu-agent-config
        - name: oo-auth
          secret:
            secretName: oo-auth
            items:
              - key: OO_AUTH_HEADER
                path: OO_AUTH_HEADER
        - name: config-final
          emptyDir: {}
