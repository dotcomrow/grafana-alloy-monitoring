apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-k8s-monitoring-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-k8s-monitoring-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-k8s-monitoring-logs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: logging-and-monitoring
---
# ServiceAccount and RBAC for copying OpenObserve auth secret across namespaces
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copy-openobserve-secret
  namespace: openobserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: copy-openobserve-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: copy-openobserve-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: copy-openobserve-secret
subjects:
  - kind: ServiceAccount
    name: copy-openobserve-secret
    namespace: openobserve
---
# Job to copy OpenObserve root token from openobserve namespace to monitoring namespace
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-openobserve-root-token
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    linkerd.io/inject: "disabled"
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: copy-openobserve-secret
      restartPolicy: OnFailure
      containers:
      - name: copy-secret
        image: alpine/k8s:1.31.4
        command:
        - sh
        - -c
        - |
          set -e
          SRC_NS=openobserve
          DST_NS=logging-and-monitoring

          if ! kubectl get secret oo-auth -n "${SRC_NS}" >/dev/null 2>&1; then
            echo "❌ Source secret oo-auth not found in ${SRC_NS}" >&2
            exit 1
          fi

          AUTH_B64="$(kubectl get secret oo-auth -n "${SRC_NS}" -o jsonpath='{.data.OO_AUTH_HEADER}')"
          if [ -z "${AUTH_B64}" ]; then
            echo "❌ OO_AUTH_HEADER missing in source secret" >&2
            exit 1
          fi

          AUTH_HEADER="$(printf '%s' "${AUTH_B64}" | base64 -d)"
          if [ "${AUTH_HEADER#Basic }" = "${AUTH_HEADER}" ]; then
            echo "❌ OO_AUTH_HEADER must be a Basic header (e.g., 'Basic base64(user:pass)')" >&2
            exit 1
          fi

          PAYLOAD="${AUTH_HEADER#Basic }"
          USERPASS="$(printf '%s' "${PAYLOAD}" | base64 -d 2>/dev/null || true)"
          USERNAME="${USERPASS%%:*}"
          PASSWORD="${USERPASS#*:}"
          if [ -z "${USERNAME}" ] || [ "${USERNAME}" = "${USERPASS}" ]; then
            echo "❌ Unable to parse Basic credentials from OO_AUTH_HEADER" >&2
            exit 1
          fi

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: oo-auth
            namespace: ${DST_NS}
          type: Opaque
          stringData:
            OO_AUTH_HEADER: "${AUTH_HEADER}"
            username: "${USERNAME}"
            password: "${PASSWORD}"
          EOF
          echo "✅ Secret synced to ${DST_NS} with parsed credentials (if present)."
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
spec:
  project: logging-and-monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 2.0.23
    helm:
      releaseName: grafana-k8s-monitoring
      values: |
        cluster:
          name: suncoast-systems-k8s-cluster
        kubeStateMetrics:
          enabled: true
        destinations:
          - name: openobserve-otlp
            type: otlp
            # Send directly to OpenObserve OTLP HTTP listener with Basic creds from oo-auth secret
            url: http://openobserve-openobserve-standalone.openobserve.svc.cluster.local:5080/api/default/default/otlp
            protocol: http
            auth:
              type: basic
              usernameFrom: env("OO_AUTH_USERNAME")
              passwordFrom: env("OO_AUTH_PASSWORD")
            extraHeaders:
              organization: default
              stream-name: default
            tls:
              insecure: true
            traces:
              enabled: true
            logs:
              enabled: true
            metrics:
              enabled: true
        clusterMetrics:
          enabled: true
          opencost:
            enabled: false
            metricsSource: openobserve-otlp
            opencost:
              exporter:
                defaultClusterId: suncoast-systems-k8s-cluster
              prometheus:
                existingSecretName: ""
                external:
                  url: ""
          kepler:
            enabled: false
        clusterEvents:
          enabled: true
        nodeLogs:
          enabled: false
        podLogs:
          enabled: true
        applicationObservability:
          enabled: true
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411
          connectors: {}
        autoInstrumentation:
          enabled: false
        alloy-metrics:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
            metrics:
              configs:
                - name: trim-unneeded-metrics
                  scrape_configs:
                    - job_name: 'node'
                      metric_relabel_configs:
                        - source_labels: [fstype]
                          regex: "tmpfs|devtmpfs|overlay"
                          action: drop
                    - job_name: 'kubelet'
                      metric_relabel_configs:
                        - source_labels: [container]
                          regex: "POD|pause|"
                          action: drop
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: OO_AUTH_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: username
              - name: OO_AUTH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: password
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            remoteConfig:
              enabled: false
        alloy-singleton:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: OO_AUTH_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: username
              - name: OO_AUTH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: password
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            remoteConfig:
              enabled: false
        alloy-logs:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            config:
              logs:
                config:
                  feature.pod_logs:
                    discovery.relabel.filtered_pods_with_paths:
                      rules:
                        - source_labels:
                            - __meta_kubernetes_namespace
                            - __meta_kubernetes_pod_name
                            - __meta_kubernetes_pod_uid
                            - __meta_kubernetes_pod_container_name
                          separator: "_"
                          action: replace
                          replacement: "/var/log/pods/$1_$2_$3/$4/*.log"
                          target_label: __path__
                  feature.node_logs:
                    journal_path: /var/log/journal
                    matchers:
                      - "_SYSTEMD_UNIT=kubelet.service"
                      - "_SYSTEMD_UNIT=containerd.service"
                      - "_SYSTEMD_UNIT=networkd-dispatcher.service"
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: OO_AUTH_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: username
              - name: OO_AUTH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: password
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            remoteConfig:
              enabled: false
            volumeMounts:
              - name: journal
                mountPath: /var/log/journal
                readOnly: true
            volumes:
              - name: journal
                hostPath:
                  path: /var/log/journal
        alloy-receiver:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: zipkin
                port: 9411
                targetPort: 9411
                protocol: TCP
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: OO_AUTH_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: username
              - name: OO_AUTH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: password
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            remoteConfig:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging-and-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
