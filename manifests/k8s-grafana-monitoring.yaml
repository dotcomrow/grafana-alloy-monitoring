apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-k8s-monitoring-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-k8s-monitoring-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-k8s-monitoring-logs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: logging-and-monitoring
---
# ServiceAccount and RBAC for copying OpenObserve auth secret across namespaces
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copy-openobserve-secret
  namespace: openobserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: copy-openobserve-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: copy-openobserve-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: copy-openobserve-secret
subjects:
  - kind: ServiceAccount
    name: copy-openobserve-secret
    namespace: openobserve
---
# Job to copy OpenObserve root token from openobserve namespace to monitoring namespace
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-openobserve-root-token-basic
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    linkerd.io/inject: "disabled"
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: copy-openobserve-secret
      restartPolicy: OnFailure
      containers:
      - name: copy-secret
        image: alpine/k8s:1.31.4
        command:
        - sh
        - -c
        - |
          set -e
          SRC_NS=openobserve
          DST_NS=logging-and-monitoring

          if kubectl get secret oo-auth -n "${DST_NS}" >/dev/null 2>&1; then
            echo "🔄 openobserve secret already exists in ${DST_NS}"
          else
            echo "🔁 Copying 'oo-auth' from ${SRC_NS} → ${DST_NS}..."
            kubectl get secret oo-auth -n "${SRC_NS}" -o yaml | \
              sed "s/namespace: ${SRC_NS}/namespace: ${DST_NS}/" | \
              kubectl apply -f -
            echo "✅ Secret copied successfully."
          fi
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
  annotations:
      argocd.argoproj.io/sync-wave: "2"
      linkerd.io/inject: "disabled"
spec:
  project: logging-and-monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 2.0.23
    helm:
      releaseName: grafana-k8s-monitoring
      values: |
        cluster:
          name: suncoast-systems-k8s-cluster
        kubeStateMetrics:
          enabled: true
        destinations:
          - name: openobserve-prometheus
            type: prometheus
            url: http://openobserve-router.openobserve.svc.cluster.local:5080/api/default/prometheus/api/v1/write
            auth:
              type: none
            extraHeaders:
              organization: default
              stream-name: default
            extraHeadersFrom:
              Authorization: env("OO_AUTH_HEADER")
            tls:
              insecure: true
          - name: openobserve-otlp
            type: otlp
            # Send directly to OpenObserve OTLP gRPC listener with Authorization header from oo-auth secret
            url: openobserve-router.openobserve.svc.cluster.local:5081
            protocol: grpc
            auth:
              type: none
            extraHeaders:
              organization: default
              stream-name: default
            extraHeadersFrom:
              Authorization: env("OO_AUTH_HEADER")
            tls:
              insecure: true
            traces:
              enabled: true
            logs:
              enabled: true
            metrics:
              enabled: true
        clusterMetrics:
          enabled: true
          destinations:
            - openobserve-prometheus
          kube-state-metrics:
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
          node-exporter:
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
          opencost:
            enabled: false
            metricsSource: openobserve-otlp
            opencost:
              exporter:
                defaultClusterId: suncoast-systems-k8s-cluster
              prometheus:
                existingSecretName: ""
                external:
                  url: ""
          kepler:
            enabled: false
        clusterEvents:
          enabled: true
        nodeLogs:
          enabled: false
        podLogs:
          enabled: true
        applicationObservability:
          enabled: true
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411
          connectors: {}
        autoInstrumentation:
          enabled: false
        alloy-metrics:
          enabled: true
          alloy:
            metrics:
              configs:
                - name: trim-unneeded-metrics
                  scrape_configs:
                    - job_name: 'node'
                      metric_relabel_configs:
                        - source_labels: [fstype]
                          regex: "tmpfs|devtmpfs|overlay"
                          action: drop
                    - job_name: 'kubelet'
                      metric_relabel_configs:
                        - source_labels: [container]
                          regex: "POD|pause|"
                          action: drop
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            resources:
              requests:
                cpu: 100m
                memory: 700Mi
              limits:
                cpu: 500m
                memory: 1Gi
            remoteConfig:
              enabled: false
          configReloader:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 50m
                memory: 256Mi
        alloy-singleton:
          enabled: true
          alloy:
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
            remoteConfig:
              enabled: false
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
        alloy-logs:
          enabled: true
          alloy:
            config:
              logs:
                config:
                  feature.pod_logs:
                    discovery.relabel.filtered_pods_with_paths:
                      rules:
                        - source_labels:
                            - __meta_kubernetes_namespace
                            - __meta_kubernetes_pod_name
                            - __meta_kubernetes_pod_uid
                            - __meta_kubernetes_pod_container_name
                          separator: "_"
                          action: replace
                          replacement: "/var/log/pods/$1_$2_$3/$4/*.log"
                          target_label: __path__
                  feature.node_logs:
                    journal_path: /var/log/journal
                    matchers:
                      - "_SYSTEMD_UNIT=kubelet.service"
                      - "_SYSTEMD_UNIT=containerd.service"
                      - "_SYSTEMD_UNIT=networkd-dispatcher.service"
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            remoteConfig:
              enabled: false
            volumeMounts:
              - name: journal
                mountPath: /var/log/journal
                readOnly: true
            volumes:
              - name: journal
                hostPath:
                  path: /var/log/journal
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
        alloy-receiver:
          enabled: true
          alloy:
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: zipkin
                port: 9411
                targetPort: 9411
                protocol: TCP
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi
            remoteConfig:
              enabled: false
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: logging-and-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
