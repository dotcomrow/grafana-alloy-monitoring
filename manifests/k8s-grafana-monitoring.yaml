apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-k8s-monitoring-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-k8s-monitoring-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-k8s-monitoring-logs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: logging-and-monitoring
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
spec:
  project: logging-and-monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 2.0.23
    helm:
      releaseName: grafana-k8s-monitoring
      values: |
        cluster:
          name: suncoast-systems-k8s-cluster
        kubeStateMetrics:
          enabled: true
        destinations:
          - name: grafana-cloud-metrics
            type: prometheus
            url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
            auth:
              type: basic
              username: <vault:secret/data/grafana-alloy-monitoring-metrics-username#value>
              password: <path:secret/data/grafana-alloy-monitoring-metrics-password#value>
          - name: grafana-cloud-logs
            type: loki
            url: https://logs-prod-036.grafana.net/loki/api/v1/push
            auth:
              type: basic
              username: <path:secret/data/grafana-alloy-monitoring-logs-username#value>
              password: <path:secret/data/grafana-alloy-monitoring-logs-password#value>
          - name: grafana-cloud-traces
            type: otlp
            url: https://tempo-prod-26-prod-us-east-2.grafana.net
            protocol: grpc
            auth:
              type: basic
              username: <path:secret/data/grafana-alloy-monitoring-traces-username#value>
              password: <path:secret/data/grafana-alloy-monitoring-traces-password#value>
            traces:
              enabled: true
            logs:
              enabled: false
            metrics:
              enabled: false
        clusterMetrics:
          enabled: true
          opencost:
            enabled: true
            metricsSource: grafana-cloud-metrics
            opencost:
              exporter:
                defaultClusterId: suncoast-systems-k8s-cluster
              prometheus:
                existingSecretName: grafana-cloud-metrics-grafana-k8s-monitoring
                external:
                  url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom
          kepler:
            enabled: false
        clusterEvents:
          enabled: true
        nodeLogs:
          enabled: false
        podLogs:
          enabled: true
        applicationObservability:
          enabled: true
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411
          connectors:
            grafanaCloudMetrics:
              enabled: true
        autoInstrumentation:
          enabled: false
        alloy-metrics:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
            metrics:
              configs:
                - name: trim-unneeded-metrics
                  scrape_configs:
                    - job_name: 'node'
                      metric_relabel_configs:
                        - source_labels: [fstype]
                          regex: "tmpfs|devtmpfs|overlay"
                          action: drop
                    - job_name: 'kubelet'
                      metric_relabel_configs:
                        - source_labels: [container]
                          regex: "POD|pause|"
                          action: drop
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                value: <path:secret/data/grafana-alloy-monitoring-gcloud-rw-api-key#value>
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-metrics-$(CLUSTER_NAME)-$(NAMESPACE)-$(POD_NAME)
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-008.grafana.net
              auth:
                type: basic
                username: <path:secret/data/grafana-alloy-monitoring-remoteconfig-username#value>
                password: <path:secret/data/grafana-alloy-monitoring-remoteconfig-password#value>
        alloy-singleton:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                value: <path:secret/data/grafana-alloy-monitoring-gcloud-rw-api-key#value>
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-singleton-$(CLUSTER_NAME)-$(NAMESPACE)-$(POD_NAME)
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-008.grafana.net
              auth:
                type: basic
                username: <path:secret/data/grafana-alloy-monitoring-remoteconfig-username#value>
                password: <path:secret/data/grafana-alloy-monitoring-remoteconfig-password#value>
        alloy-logs:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            config:
              logs:
                config:
                  feature.pod_logs:
                    discovery.relabel.filtered_pods_with_paths:
                      rules:
                        - source_labels:
                            - __meta_kubernetes_namespace
                            - __meta_kubernetes_pod_name
                            - __meta_kubernetes_pod_uid
                            - __meta_kubernetes_pod_container_name
                          separator: "_"
                          action: replace
                          replacement: "/var/log/pods/$1_$2_$3/$4/*.log"
                          target_label: __path__
                  feature.node_logs:
                    journal_path: /var/log/journal
                    matchers:
                      - "_SYSTEMD_UNIT=kubelet.service"
                      - "_SYSTEMD_UNIT=containerd.service"
                      - "_SYSTEMD_UNIT=networkd-dispatcher.service"
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                value: <path:secret/data/grafana-alloy-monitoring-gcloud-rw-api-key#value>
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-alloy-logs-$(NODE_NAME)
            remoteConfig:
              enabled: true
              url: https://fleet-management-prod-008.grafana.net
              auth:
                type: basic
                username: <path:secret/data/grafana-alloy-monitoring-remoteconfig-username#value>
                password: <path:secret/data/grafana-alloy-monitoring-remoteconfig-password#value>
            volumeMounts:
              - name: journal
                mountPath: /var/log/journal
                readOnly: true
            volumes:
              - name: journal
                hostPath:
                  path: /var/log/journal
        alloy-receiver:
          enabled: true
          alloy:
            resources:
              requests:
                cpu: "250m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: zipkin
                port: 9411
                targetPort: 9411
                protocol: TCP
            extraEnv:
              - name: GCLOUD_RW_API_KEY
                value: <path:secret/data/grafana-alloy-monitoring-gcloud-rw-api-key#value>
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: GCLOUD_FM_COLLECTOR_ID
                value: grafana-k8s-monitoring-$(CLUSTER_NAME)-$(NAMESPACE)-alloy-receiver-$(NODE_NAME)
            remoteConfig:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: logging-and-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
