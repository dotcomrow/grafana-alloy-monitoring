apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-k8s-monitoring-logs
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-k8s-monitoring-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-k8s-monitoring-logs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: logging-and-monitoring
---
# ServiceAccount and RBAC for copying OpenObserve auth secret across namespaces
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copy-openobserve-secret
  namespace: openobserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: copy-openobserve-secret
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: copy-openobserve-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: copy-openobserve-secret
subjects:
  - kind: ServiceAccount
    name: copy-openobserve-secret
    namespace: openobserve
---
# Job to copy OpenObserve root token from openobserve namespace to monitoring namespace
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-openobserve-root-token-basic
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    linkerd.io/inject: "disabled"
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: copy-openobserve-secret
      restartPolicy: OnFailure
      containers:
      - name: copy-secret
        image: alpine/k8s:1.31.4
        command:
        - sh
        - -c
        - |
          set -e
          SRC_NS=openobserve
          DST_NS=logging-and-monitoring

          if kubectl get secret oo-auth -n "${DST_NS}" >/dev/null 2>&1; then
            echo "🔄 openobserve secret already exists in ${DST_NS}"
          else
            echo "🔁 Copying 'oo-auth' from ${SRC_NS} → ${DST_NS}..."
            kubectl get secret oo-auth -n "${SRC_NS}" -o yaml | \
              sed "s/namespace: ${SRC_NS}/namespace: ${DST_NS}/" | \
              kubectl apply -f -
            echo "✅ Secret copied successfully."
          fi
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-k8s-monitoring
  namespace: argocd
  annotations:
      argocd.argoproj.io/sync-wave: "2"
      linkerd.io/inject: "disabled"
spec:
  project: logging-and-monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 2.0.23
    helm:
      releaseName: grafana-k8s-monitoring
      values: |
        cluster:
          name: suncoast-systems-k8s-cluster
        kubeStateMetrics:
          enabled: false
        destinations:
          - name: openobserve-pod-logs
            type: otlp
            # Send pod logs to a dedicated stream for easy discovery in OpenObserve
            url: openobserve-router.openobserve.svc.cluster.local:5081
            protocol: grpc
            auth:
              type: none
            extraHeaders:
              organization: default
              stream-name: k8s_pod_logs
            extraHeadersFrom:
              Authorization: env("OO_AUTH_HEADER")
            tls:
              insecure: true
            logs:
              enabled: true
          - name: openobserve-otlp
            type: otlp
            # Send directly to OpenObserve OTLP gRPC listener with Authorization header from oo-auth secret
            url: openobserve-router.openobserve.svc.cluster.local:5081
            protocol: grpc
            auth:
              type: none
            extraHeaders:
              organization: default
              stream-name: default
            extraHeadersFrom:
              Authorization: env("OO_AUTH_HEADER")
            tls:
              insecure: true
            traces:
              enabled: true
            logs:
              enabled: true
            metrics:
              enabled: true
        clusterMetrics:
          enabled: false
        clusterEvents:
          enabled: true
        nodeLogs:
          enabled: false
        podLogs:
          enabled: true
          destinations:
            - openobserve-pod-logs
            - openobserve-otlp
          extraLogProcessingStages: |
            stage.match {
              selector = "{container=\"gravitee-reporter-tail\"}"
              stage.json {
                source = "body"
                expressions = {
                  traceparent = "entrypointRequest.headers.traceparent",
                  trace_id = "entrypointRequest.headers.trace_id",
                  span_id = "entrypointRequest.headers.span_id",
                  x_forwarded_for = "entrypointRequest.headers.\"x-forwarded-for\"",
                  x_forwarded_host = "entrypointRequest.headers.\"x-forwarded-host\"",
                  x_forwarded_proto = "entrypointRequest.headers.\"x-forwarded-proto\"",
                  x_real_ip = "entrypointRequest.headers.\"x-real-ip\"",
                  x_client_ip = "entrypointRequest.headers.\"x-client-ip\"",
                  user_agent = "entrypointRequest.headers.\"user-agent\"",
                  x_user_email = "entrypointRequest.headers.\"x-user-email\"",
                  x_user_id = "entrypointRequest.headers.\"x-user-id\"",
                  x_user_issuer = "entrypointRequest.headers.\"x-user-issuer\"",
                  x_user_username = "entrypointRequest.headers.\"x-user-username\"",
                  gravitee_request_id = "entrypointRequest.headers.\"x-gravitee-request-id\" || entrypointRequest.headers.\"X-Gravitee-Request-Id\"",
                  gravitee_transaction_id = "entrypointRequest.headers.\"x-gravitee-transaction-id\" || entrypointRequest.headers.\"X-Gravitee-Transaction-Id\"",
                }
              }
              stage.regex {
                source = "traceparent"
                expression = "[0-9a-f]{2}-(?P<trace_id>[0-9a-f]{32})-(?P<span_id>[0-9a-f]{16})-[0-9a-f]{2}"
              }
              stage.labels {
                values = {
                  traceparent = "",
                  trace_id = "",
                  span_id = "",
                  x_forwarded_for = "",
                  x_forwarded_host = "",
                  x_forwarded_proto = "",
                  x_real_ip = "",
                  x_client_ip = "",
                  user_agent = "",
                  x_user_email = "",
                  x_user_id = "",
                  x_user_issuer = "",
                  x_user_username = "",
                  gravitee_request_id = "",
                  gravitee_transaction_id = "",
                }
              }
            }
            stage.match {
              selector = "{container=\"apisix\"}"
              stage.json {
                source = "body"
                expressions = {
                  traceparent = "traceparent",
                  trace_id = "trace_id",
                  span_id = "span_id",
                  remote_addr = "remote_addr",
                  x_forwarded_for = "x_forwarded_for",
                  x_forwarded_host = "x_forwarded_host",
                  x_forwarded_proto = "x_forwarded_proto",
                  x_real_ip = "x_real_ip",
                  x_client_ip = "x_client_ip",
                  user_agent = "user_agent",
                  host = "host",
                  scheme = "scheme",
                  method = "method",
                  uri = "uri",
                  status = "status",
                  request_time = "request_time",
                  upstream_status = "upstream_status",
                  upstream_response_time = "upstream_response_time",
                }
              }
              stage.labels {
                values = {
                  traceparent = "",
                  trace_id = "",
                  span_id = "",
                  remote_addr = "",
                  x_forwarded_for = "",
                  x_forwarded_host = "",
                  x_forwarded_proto = "",
                  x_real_ip = "",
                  x_client_ip = "",
                  user_agent = "",
                  host = "",
                  scheme = "",
                  method = "",
                  uri = "",
                  status = "",
                  request_time = "",
                  upstream_status = "",
                  upstream_response_time = "",
                }
              }
            }
            stage.match {
              selector = "{container!=\"gravitee-reporter-tail\",container!=\"apisix\"}"
              stage.json {
                expressions = {
                  trace_id = "trace_id",
                  span_id = "span_id",
                  traceparent = "traceparent",
                  remote_addr = "remote_addr",
                  x_forwarded_for = "x_forwarded_for",
                  x_forwarded_host = "x_forwarded_host",
                  x_forwarded_proto = "x_forwarded_proto",
                  x_real_ip = "x_real_ip",
                  x_client_ip = "x_client_ip",
                  user_agent = "user_agent",
                  x_user_email = "x_user_email",
                  x_user_id = "x_user_id",
                  x_user_issuer = "x_user_issuer",
                  x_user_username = "x_user_username",
                  gravitee_request_id = "requestId",
                  gravitee_transaction_id = "requestId",
                  host = "host",
                  scheme = "scheme",
                  method = "method",
                  uri = "uri",
                  status = "status",
                  request_time = "request_time",
                  upstream_status = "upstream_status",
                  upstream_response_time = "upstream_response_time",
                }
              }
              stage.labels {
                values = {
                  trace_id = "",
                  span_id = "",
                  traceparent = "",
                  remote_addr = "",
                  x_forwarded_for = "",
                  x_forwarded_host = "",
                  x_forwarded_proto = "",
                  x_real_ip = "",
                  x_client_ip = "",
                  user_agent = "",
                  x_user_email = "",
                  x_user_id = "",
                  x_user_issuer = "",
                  x_user_username = "",
                  gravitee_request_id = "",
                  gravitee_transaction_id = "",
                  host = "",
                  scheme = "",
                  method = "",
                  uri = "",
                  status = "",
                  request_time = "",
                  upstream_status = "",
                  upstream_response_time = "",
                }
              }
            }
          labelsToKeep:
            - app.kubernetes.io/name
            - container
            - instance
            - job
            - level
            - namespace
            - service.name
            - service.namespace
            - deployment.environment
            - deployment.environment.name
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - trace_id
            - span_id
            - traceparent
            - remote_addr
            - x_forwarded_for
            - x_forwarded_host
            - x_forwarded_proto
            - x_real_ip
            - x_client_ip
            - user_agent
            - x_user_email
            - x_user_id
            - x_user_issuer
            - x_user_username
            - gravitee_request_id
            - gravitee_transaction_id
            - host
            - scheme
            - method
            - uri
            - status
            - request_time
            - upstream_status
            - upstream_response_time
        applicationObservability:
          enabled: true
          receivers:
            otlp:
              grpc:
                enabled: true
                port: 4317
              http:
                enabled: true
                port: 4318
            zipkin:
              enabled: true
              port: 9411
          connectors: {}
        autoInstrumentation:
          enabled: false
        alloy-metrics:
          enabled: false
        alloy-singleton:
          enabled: true
          podAnnotations:
            reloader.stakater.com/auto: "true"
          alloy:
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 200m
                memory: 512Mi
            remoteConfig:
              enabled: false
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
        alloy-logs:
          enabled: true
          controller:
            podAnnotations:
              reloader.stakater.com/auto: "true"
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            remoteConfig:
              enabled: false
            volumes:
              extra:
                - name: journal
                  hostPath:
                    path: /var/log/journal
          alloy:
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            mounts:
              extra:
                - name: journal
                  mountPath: /var/log/journal
                  readOnly: true
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
        alloy-receiver:
          enabled: true
          alloy:
            extraPorts:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: zipkin
                port: 9411
                targetPort: 9411
                protocol: TCP
            extraEnv:
              - name: OO_AUTH_HEADER
                valueFrom:
                  secretKeyRef:
                    name: oo-auth
                    key: OO_AUTH_HEADER
              - name: CLUSTER_NAME
                value: suncoast-systems-k8s-cluster
              - name: NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi
            remoteConfig:
              enabled: false
          configReloader:
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: logging-and-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
